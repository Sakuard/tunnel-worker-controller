name: tunnel-manager
namespace: monitoring

env:
  secretName: cloudflared-tunnel
  keys:
    - TG_BOT_TOKEN
    - TG_CHAT_ID

controller:
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
    limits:
      cpu: 50m
      memory: 100Mi

createExternalSecret:
  refreshInterval: 1m
  name: cloudflared-tunnel
  creationPolicy: Owner
  secretStoreRef: 
    name: gcp-secret-manager
    kind: ClusterSecretStore
